<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LeNet 手写数字识别实验室</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5fa;color:#182a40;font-family:'Microsoft YaHei',sans-serif}main{max-width:1120px;margin:48px auto;padding:0 24px}small{letter-spacing:2px;color:#187d84}h1{font-size:34px;margin:12px 0}header p{color:#617085;line-height:1.8}.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;margin-top:28px}.card{background:white;padding:28px;border-radius:20px;border:1px solid #e0e7ef;box-shadow:0 10px 35px #20375008}canvas{display:block;background:black;border-radius:14px;touch-action:none;margin:20px auto;max-width:100%;cursor:crosshair}button,select,input{font:inherit}button{padding:11px 20px;border:0;border-radius:9px;background:#1e697d;color:white;cursor:pointer}button.secondary{background:#edf2f7;color:#254258}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}label{display:block;font-size:14px;color:#52647b;margin:14px 0 6px}select{width:100%;padding:11px;border:1px solid #cad5e1;border-radius:8px;background:#fff}.digit{font-size:96px;font-weight:bold;line-height:1.2;margin-top:20px}.note{color:#65748a;font-size:13px;line-height:1.8}.status{padding:12px;border-radius:8px;background:#edf5f7;margin:14px 0}.bars{margin:24px 0}.bar{display:grid;grid-template-columns:22px 1fr 65px;align-items:center;gap:8px;margin:9px 0;font-size:13px}.track{background:#eff3f8;height:9px;border-radius:6px;overflow:hidden}.fill{background:#288e9d;height:100%}input[type=file]{max-width:100%;font-size:13px}footer{margin:20px 0;color:#687b90;font-size:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}main{margin:24px auto}h1{font-size:26px}}
</style>
<main><header><small>CLASSIC CNN / MNIST</small><h1>LeNet 手写数字识别实验室</h1><p>在画布写一个数字，比较经典卷积、深度可分离卷积与 SE 注意力的识别结果。<br>面向票据录入和邮政编码的单字切片演示。</p></header>
<div class="grid"><section class="card"><div class="row"><button class="secondary" id="clear">清空画布</button><button class="secondary" id="sample">载入测试样本</button></div><canvas width="280" height="280" id="canvas"></canvas><div class="note" id="source">用鼠标或触屏写 0 到 9 中的一个数字</div><label>上传单个数字图片</label><input id="upload" type="file" accept="image/*"><label>选择模型</label><select id="model"><option value="baseline">LeNet-5 基线</option><option value="dw_c3">DW-C3 局部替换对照</option><option value="dw">DW-C3+C5 双位置轻量化</option><option value="se">SE 通道注意力</option><option value="dw_se">DW + SE 组合</option></select><label>人工复核阈值 <span id="thresholdText">90%</span></label><input id="threshold" type="range" min="0" max="100" value="90"><div style="margin-top:18px"><button id="predict">识别数字</button></div></section>
<section class="card"><small>PREDICTION</small><div class="digit" id="digit">?</div><div id="confidence">等待输入</div><div class="status" id="status" role="status">写好后点击识别数字</div><div class="bars" id="bars"></div><p class="note">置信度来自 softmax，未经校准。低置信度结果应人工复核；高置信度结果也可能出错。<br>本演示只处理单个数字，不包含整页文字检测、字符切分或多位数串识别。</p></section></div>
<footer>MNIST 官方测试样本与手写输入使用不同预处理。模型均从零训练，未使用预训练权重。<a href="https://github.com/linpianpiann777-prog/lenet5-mnist-innovations" target="_blank">GitHub 代码与运行说明</a></footer></main>
<script>
const $=id=>document.getElementById(id),c=$('canvas'),ctx=c.getContext('2d');let mode='canvas',source=null,drawing=false,sampleIndex=0;
function clear(){ctx.fillStyle='black';ctx.fillRect(0,0,280,280);mode='canvas';source=null;$('source').textContent='用鼠标或触屏写 0 到 9 中的一个数字'}clear();
function point(e){const r=c.getBoundingClientRect();return [(e.clientX-r.left)*280/r.width,(e.clientY-r.top)*280/r.height]}
c.onpointerdown=e=>{if(mode==='mnist')clear();drawing=true;c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...point(e));ctx.strokeStyle='white';ctx.lineWidth=20;ctx.lineCap='round';ctx.lineJoin='round';mode='canvas';source=null};
c.onpointermove=e=>{if(drawing){ctx.lineTo(...point(e));ctx.stroke()}};c.onpointerup=()=>drawing=false;c.onpointercancel=()=>drawing=false;
$('clear').onclick=clear;$('threshold').oninput=()=>{$('thresholdText').textContent=$('threshold').value+'%'};
$('sample').onclick=async()=>{try{const r=await fetch('/api/sample?index='+sampleIndex++%10000),d=await r.json(),img=new Image();img.onload=()=>{ctx.imageSmoothingEnabled=false;ctx.drawImage(img,0,0,280,280)};img.src=d.image;mode='mnist';source=d.image;$('source').textContent=`官方测试集 #${d.index}，真实标签 ${d.label}；未用于模型训练`}catch(e){$('status').textContent=e.message}};
$('upload').onchange=e=>{const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{const im=new Image();im.onload=()=>{ctx.fillStyle='white';ctx.fillRect(0,0,280,280);ctx.imageSmoothingEnabled=true;const s=Math.min(260/im.width,260/im.height);ctx.drawImage(im,(280-im.width*s)/2,(280-im.height*s)/2,im.width*s,im.height*s);mode='canvas';source=null;$('source').textContent='上传图片：'+f.name};im.src=reader.result};reader.readAsDataURL(f)};
$('predict').onclick=async()=>{try{$('status').textContent='正在识别…';const r=await fetch('/api/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:source||c.toDataURL(),mode,variant:$('model').value,threshold:$('threshold').value/100})});const d=await r.json();if(!r.ok)throw Error(d.error);$('digit').textContent=d.digit;$('confidence').textContent='置信度 '+(d.confidence*100).toFixed(2)+'%';$('status').textContent=d.accepted?'达到当前阈值，请结合原图确认':'低于阈值，建议人工复核';$('bars').innerHTML=d.probabilities.map((p,i)=>`<div class="bar"><span>${i}</span><div class="track"><div class="fill" style="width:${p*100}%"></div></div><span>${(p*100).toFixed(2)}%</span></div>`).join('')}catch(e){$('status').textContent=e.message}};
fetch('/api/info').then(r=>r.json()).then(d=>$('model').value=d.default);
</script></html>
